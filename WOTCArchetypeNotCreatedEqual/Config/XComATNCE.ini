[WOTCArchetypeNotCreatedEqual.X2DownloadableContentInfo_WOTCArchetypeNotCreatedEqual]
; Global settings
ATNCE_EnableLogging=false

; Exclude any character templates that should NOT have their stats randomized
+ATNCE_ExcludedTemplates="NestCentral"
+ATNCE_ExcludedTemplates="LostTowersShen"
+ATNCE_ExcludedTemplates="TutorialCentral"


; --- ATNCE USER GUIDE ---
; StatRanges: (Low=Potato, Mid=Average, High=Elite)
; TierWeights: Percentage chance to land in that tier (D, C, B, A).
;   D = Poor (Penalty)
;   C = Average (The Majority)
;   B = High (Professional)
;   A = Elite (Legendary)
; ATNCE_TierMaxOverlaps: % of a tier's range that can "bleed" into the next tier.

; === Archetype Soldier Settings Tuned for XCOM2 LWOTC===
ATNCE_EnableArchetypeSoldiers=true
ATNCE_ArchetypeChancePercent=5
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_Offense,secondaryCharStatType=eStat_Mobility)
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_HP,secondaryCharStatType=eStat_Offense)
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_HP,secondaryCharStatType=eStat_Mobility)
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_Will,secondaryCharStatType=eStat_PsiOffense)
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_Dodge,secondaryCharStatType=eStat_Mobility)
+ATNCE_ArchetypeSoldiers=(primaryCharStatType=eStat_Hacking,secondaryCharStatType=eStat_Mobility)

; === Stat Tier and Weighting Configuration ===
ATNCE_TierMaxOverlaps=(DtoCPercent=15,CtoBPercent=12,BtoAPercent=6)
ATNCE_SyncCombatIntelligence=true

;XCOM2 LWOTC (Update as needed for Vanilla WOTC)
+ATNCE_StatTierWeights=(CharStatType=eStat_HP, StatGroupType=ATNCE_Primary, StatRanges=(RangeLow=3,RangeMid=4,RangeHigh=7), TierWeights=(WeightD=20,WeightC=55,WeightB=22,WeightA=3))
+ATNCE_StatTierWeights=(CharStatType=eStat_Offense, StatGroupType=ATNCE_Primary, StatRanges=(RangeLow=55,RangeMid=65,RangeHigh=76), TierWeights=(WeightD=30,WeightC=50,WeightB=15,WeightA=5))
+ATNCE_StatTierWeights=(CharStatType=eStat_Mobility, StatGroupType=ATNCE_Primary, StatRanges=(RangeLow=13,RangeMid=15,RangeHigh=18), TierWeights=(WeightD=35,WeightC=46,WeightB=18,WeightA=3))
+ATNCE_StatTierWeights=(CharStatType=eStat_Will, StatGroupType=ATNCE_Secondary, StatRanges=(RangeLow=15,RangeMid=30,RangeHigh=45), TierWeights=(WeightD=25,WeightC=55,WeightB=15,WeightA=5))
+ATNCE_StatTierWeights=(CharStatType=eStat_PsiOffense, StatGroupType=ATNCE_Secondary, StatRanges=(RangeLow=0,RangeMid=15,RangeHigh=35), TierWeights=(WeightD=40,WeightC=45,WeightB=10,WeightA=5))
+ATNCE_StatTierWeights=(CharStatType=eStat_Hacking, StatGroupType=ATNCE_OtherOffence, StatRanges=(RangeLow=0,RangeMid=12,RangeHigh=25), TierWeights=(WeightD=30,WeightC=45,WeightB=20,WeightA=5))
+ATNCE_StatTierWeights=(CharStatType=eStat_Dodge, StatGroupType=ATNCE_OtherDefence, StatRanges=(RangeLow=-2,RangeMid=10,RangeHigh=22), TierWeights=(WeightD=35,WeightC=40,WeightB=20,WeightA=5))

[WOTCArchetypeNotCreatedEqual.X2DownloadableContentInfo_WOTCArchetypeNotCreatedEqual_Utils]
; Global settings
; If ATNCE_TestSolderGenerationCount is set, test output will be logged even when ATNCE_EnableLogging=false
ATNCE_TestSolderGenerationCount=0

